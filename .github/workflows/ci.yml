name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Lint & Test
    runs-on: xcode-27

    steps:
      - name: Check Toolchain Versions
        run: |
          xcodebuild -version
          swift --version
          
      - name: Checkout code (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install SwiftLint 0.65.1
        run: |
          curl -sSL https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip -o /tmp/swiftlint.zip
          unzip -q /tmp/swiftlint.zip -d /tmp/swiftlint
          sudo mv /tmp/swiftlint/swiftlint /usr/local/bin/
          swiftlint version

      - name: Run swift-format Lint
        run: swift format lint --recursive --strict ChiTieu Core Features

      - name: Run SwiftLint
        run: swiftlint lint --strict

      - name: Run Core Tests
        run: swift test --package-path Core --enable-code-coverage

      - name: Run Features Tests
        run: swift test --package-path Features --enable-code-coverage

      - name: Report Coverage
        run: |
          {
            echo "### Test Coverage"
            echo "| Package | Lines |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for pkg in Core Features; do
            COV_PATH=$(swift test --package-path "$pkg" --show-codecov-path)
            STATS=$(jq -r '.data[0].totals.lines | "\(.covered)/\(.count) (\((.percent * 100 | round) / 100)%)"' "$COV_PATH")
            echo "$pkg coverage: $STATS"
            echo "| $pkg | $STATS |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Build App Target
        run: |
          xcodebuild -project ChiTieu.xcodeproj \
                     -scheme ChiTieu \
                     -destination "generic/platform=iOS Simulator" \
                     build
